[package]
name = "porygon-tui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Keep this standalone client independent even inside a nested git worktree.
[workspace]

[dependencies]
ulttui = { path = "../../crates/ulttui" }
ultty-protocol = { path = "../../crates/ultty-protocol" }
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
unicode-width = "0.2"
libc = "0.2"

[dev-dependencies]
ratatui = "0.30"
