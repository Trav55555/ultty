[package]
name = "ultty-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Not a workspace member: cargo-fuzz needs nightly and its own profile.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ultty-protocol = { path = "../crates/ultty-protocol" }
ultty-vt = { path = "../crates/ultty-vt" }
base64 = "0.21"
miniz_oxide = "0.8"

[[bin]]
name = "decode_app"
path = "fuzz_targets/decode_app.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_terminal"
path = "fuzz_targets/decode_terminal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vt_terminal"
path = "fuzz_targets/vt_terminal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "in_band_split"
path = "fuzz_targets/in_band_split.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kitty_graphics"
path = "fuzz_targets/kitty_graphics.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_decode"
path = "fuzz_targets/image_decode.rs"
test = false
doc = false
bench = false
