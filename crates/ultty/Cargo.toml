[package]
name = "ultty"
description = "GPU-accelerated terminal emulator with native TUI protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ultty"
path = "src/lib.rs"

[[bin]]
name = "ultty"
path = "src/main.rs"

[[bin]]
name = "ulttyctl"
path = "src/bin/ulttyctl.rs"

[dependencies]
# Protocol
ultty-protocol = { workspace = true }
bytes = { workspace = true }

# Layout
taffy = { workspace = true }

# GPU Rendering
wgpu = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }

# Text
cosmic-text = { workspace = true }

# Async
tokio = { workspace = true }
pollster = "0.3"

# Clipboard
arboard = "3.4"

# Utilities
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { version = "1.0", features = ["derive"] }

# Configuration
toml = "0.8"
dirs = "5.0"
notify = "6.1"
serde_json = "1.0"

# URL detection
regex = "1.10"
open = "5.0"

# Unicode
unicode-width = { workspace = true }

# Encoding
base64 = "0.21"

# Image (for screenshots)
png = "0.17"
chrono = "0.4"

# Desktop notifications
notify-rust = "4.10"

# PTY
nix = { version = "0.29", features = ["term", "process", "signal", "fs"] }
libc = "0.2"
signal-hook = "0.3"
polling = "3.4"

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
insta = { workspace = true }
tempfile = "3.10"
toml = "0.8"

[package.metadata.generate-rpm]
assets = [
    { source = "target/x86_64-unknown-linux-gnu/release/ultty", dest = "/usr/bin/ultty", mode = "755" },
    { source = "target/x86_64-unknown-linux-gnu/release/ulttyctl", dest = "/usr/bin/ulttyctl", mode = "755" },
    { source = "../../dist/ultty.desktop", dest = "/usr/share/applications/ultty.desktop", mode = "644" },
    { source = "../../dist/icons/hicolor/scalable/apps/ultty.svg", dest = "/usr/share/icons/hicolor/scalable/apps/ultty.svg", mode = "644" },
    { source = "../../dist/icons/hicolor/32x32/apps/ultty.png", dest = "/usr/share/icons/hicolor/32x32/apps/ultty.png", mode = "644" },
    { source = "../../dist/icons/hicolor/64x64/apps/ultty.png", dest = "/usr/share/icons/hicolor/64x64/apps/ultty.png", mode = "644" },
    { source = "../../dist/icons/hicolor/128x128/apps/ultty.png", dest = "/usr/share/icons/hicolor/128x128/apps/ultty.png", mode = "644" },
    { source = "../../dist/icons/hicolor/256x256/apps/ultty.png", dest = "/usr/share/icons/hicolor/256x256/apps/ultty.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
wayland = "*"
libxkbcommon = "*"

[package.metadata.deb]
assets = [
    ["target/release/ultty", "usr/bin/ultty", "755"],
    ["target/release/ulttyctl", "usr/bin/ulttyctl", "755"],
    ["../../dist/ultty.desktop", "usr/share/applications/ultty.desktop", "644"],
    ["../../dist/icons/hicolor/scalable/apps/ultty.svg", "usr/share/icons/hicolor/scalable/apps/ultty.svg", "644"],
    ["../../dist/icons/hicolor/32x32/apps/ultty.png", "usr/share/icons/hicolor/32x32/apps/ultty.png", "644"],
    ["../../dist/icons/hicolor/64x64/apps/ultty.png", "usr/share/icons/hicolor/64x64/apps/ultty.png", "644"],
    ["../../dist/icons/hicolor/128x128/apps/ultty.png", "usr/share/icons/hicolor/128x128/apps/ultty.png", "644"],
    ["../../dist/icons/hicolor/256x256/apps/ultty.png", "usr/share/icons/hicolor/256x256/apps/ultty.png", "644"],
]

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "grid"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "input_latency"
harness = false

[[bench]]
name = "memory"
harness = false
