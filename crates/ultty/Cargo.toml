[package]
name = "ultty"
description = "GPU-accelerated terminal emulator with native TUI protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["gui"]
gui = [
    "dep:wgpu", "dep:winit", "dep:bytemuck", "dep:cosmic-text", "dep:foldhash",
    "dep:pollster", "dep:arboard", "dep:notify", "dep:open", "dep:png",
    "dep:accesskit", "dep:accesskit_winit", "dep:notify-rust",
]
# Count Rust heap and log it every 10 s (ultty::perf, heap_stats); used by
# scripts/bench/soak.sh. Costs two atomic operations per allocation.
heap-stats = []

[lib]
name = "ultty"
path = "src/lib.rs"

[[bin]]
name = "ultty"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "ulttyctl"
path = "src/bin/ulttyctl.rs"

[dependencies]
# Protocol
ultty-protocol = { workspace = true }

# Terminal emulation core (parser, grid, scrollback)
ultty-vt = { workspace = true }
bytes = { workspace = true }

# Layout
taffy = { workspace = true }

# GPU Rendering
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

# Text
cosmic-text = { workspace = true, optional = true }
# Hasher for the per-cell glyph and shaping caches: seeded per process like
# std's, several times cheaper than SipHash (already built for hashbrown).
foldhash = { version = "0.2", optional = true }

# Async
tokio = { workspace = true }
pollster = { version = "0.3", optional = true }

# Clipboard
arboard = { version = "3.4", optional = true }

# Utilities
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { version = "1.0", features = ["derive"] }

# Configuration
toml = "0.8"
dirs = "5.0"
notify = { version = "6.1", optional = true }
serde_json = "1.0"

# URL detection
regex = "1.10"
open = { version = "5.0", optional = true }

# Unicode
unicode-segmentation = "1.12"
unicode-width = { workspace = true }

# Encoding
base64 = { workspace = true }

# Image (for screenshots)
png = { version = "0.17", optional = true }
chrono = "0.4"

# Accessibility (ADR 0021): AT-SPI on Linux, NSAccessibility on macOS. The
# default features minus winit's, which the workspace already enables;
# async-io because Ultty runs no tokio runtime.
accesskit = { version = "0.25.2", optional = true }
accesskit_winit = { version = "0.34.2", default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"], optional = true }

# Desktop notifications
notify-rust = { version = "4.10", optional = true }

# PTY
nix = { version = "0.29", features = ["term", "process", "signal", "fs", "hostname"] }
libc = "0.2"
signal-hook = "0.3"
polling = "3.4"

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
accesskit_consumer = "0.39.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
insta = { workspace = true }
tempfile = "3.10"
ultty-bench = { path = "../../tools/ultty-bench" }
toml = "0.8"
ulttui = { path = "../ulttui" }

[package.metadata.generate-rpm]
assets = [
    { source = "target/x86_64-unknown-linux-gnu/release/ultty", dest = "/usr/bin/ultty", mode = "755" },
    { source = "target/x86_64-unknown-linux-gnu/release/ulttyctl", dest = "/usr/bin/ulttyctl", mode = "755" },
    { source = "target/x86_64-unknown-linux-gnu/release/ultty-session", dest = "/usr/bin/ultty-session", mode = "755" },
    { source = "../../dist/ultty.desktop", dest = "/usr/share/applications/ultty.desktop", mode = "644" },
    { source = "../../dist/icons/hicolor/scalable/apps/ultty.svg", dest = "/usr/share/icons/hicolor/scalable/apps/ultty.svg", mode = "644" },
    { source = "../../dist/icons/hicolor/32x32/apps/ultty.png", dest = "/usr/share/icons/hicolor/32x32/apps/ultty.png", mode = "644" },
    { source = "../../dist/icons/hicolor/64x64/apps/ultty.png", dest = "/usr/share/icons/hicolor/64x64/apps/ultty.png", mode = "644" },
    { source = "../../dist/icons/hicolor/128x128/apps/ultty.png", dest = "/usr/share/icons/hicolor/128x128/apps/ultty.png", mode = "644" },
    { source = "../../dist/icons/hicolor/256x256/apps/ultty.png", dest = "/usr/share/icons/hicolor/256x256/apps/ultty.png", mode = "644" },
    # Compiled from dist/terminfo/ultty.terminfo by the release workflow:
    # tic -x -o target/terminfo dist/terminfo/ultty.terminfo
    { source = "../../target/terminfo/x/xterm-ultty", dest = "/usr/share/terminfo/x/xterm-ultty", mode = "644" },
    { source = "../../dist/shell-integration/ultty.bash", dest = "/usr/share/ultty/shell-integration/ultty.bash", mode = "644" },
    { source = "../../dist/shell-integration/ultty.zsh", dest = "/usr/share/ultty/shell-integration/ultty.zsh", mode = "644" },
]

[package.metadata.generate-rpm.requires]
wayland = "*"
libxkbcommon = "*"

[package.metadata.deb]
assets = [
    ["target/release/ultty", "usr/bin/ultty", "755"],
    ["target/release/ulttyctl", "usr/bin/ulttyctl", "755"],
    ["target/release/ultty-session", "usr/bin/ultty-session", "755"],
    ["../../dist/ultty.desktop", "usr/share/applications/ultty.desktop", "644"],
    ["../../dist/icons/hicolor/scalable/apps/ultty.svg", "usr/share/icons/hicolor/scalable/apps/ultty.svg", "644"],
    ["../../dist/icons/hicolor/32x32/apps/ultty.png", "usr/share/icons/hicolor/32x32/apps/ultty.png", "644"],
    ["../../dist/icons/hicolor/64x64/apps/ultty.png", "usr/share/icons/hicolor/64x64/apps/ultty.png", "644"],
    ["../../dist/icons/hicolor/128x128/apps/ultty.png", "usr/share/icons/hicolor/128x128/apps/ultty.png", "644"],
    ["../../dist/icons/hicolor/256x256/apps/ultty.png", "usr/share/icons/hicolor/256x256/apps/ultty.png", "644"],
    # Compiled from dist/terminfo/ultty.terminfo by the release workflow:
    # tic -x -o target/terminfo dist/terminfo/ultty.terminfo
    ["../../target/terminfo/x/xterm-ultty", "usr/share/terminfo/x/xterm-ultty", "644"],
    ["../../dist/shell-integration/ultty.bash", "usr/share/ultty/shell-integration/ultty.bash", "644"],
    ["../../dist/shell-integration/ultty.zsh", "usr/share/ultty/shell-integration/ultty.zsh", "644"],
]

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "grid"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "vt_small_writes"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "pty_flood"
harness = false
