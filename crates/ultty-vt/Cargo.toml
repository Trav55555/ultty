[package]
name = "ultty-vt"
description = "Terminal emulation core for Ultty: VT parser, grid, scrollback, and modes, with no I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tracing = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = "1.12"
# Only for the ADR 0022 measurement prototype (`page-proto`).
foldhash = { version = "0.2", optional = true }

[features]
# Throwaway page-storage prototype (ADR 0022) for ultty-bench; never
# enabled by anything that ships.
page-proto = ["dep:foldhash"]

[build-dependencies]
unicode-width = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
