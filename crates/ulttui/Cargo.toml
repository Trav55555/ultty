[package]
name = "ulttui"
description = "TUI framework with native protocol + ANSI fallback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Protocol
ultty-protocol = { workspace = true }
ultty-client = { workspace = true }

# ttyname_r for native-mode detection
libc = "0.2"

# Fallback rendering
crossterm = { workspace = true }
ratatui = { workspace = true }

# Async
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }

# Utilities
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = "0.8"
# Luau override files (ADR 0023): off by default, so apps that do not ask
# for them do not link a Luau VM. ulttui-lua and the examples turn it on.
mlua = { version = "0.12", features = ["luau"], optional = true }
pulldown-cmark = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = "1.12"

[dev-dependencies]
tokio-test = "0.4"
insta = { workspace = true }
proptest = { workspace = true }
ulttui = { path = ".", features = ["test-utils"] }

[features]
test-utils = []
lua-overrides = ["dep:mlua"]
