[workspace]
resolver = "2"
members = [
    "crates/ultty",
    "crates/ulttui",
    "crates/ultty-protocol",
    "crates/ultty-client",
    "examples/hello-native",
    "examples/counter-app",
    "examples/todo-app",
    "examples/dashboard",
    "examples/chat",
    "examples/form-app",
    "examples/split-panes",
    "examples/async-fetch",
    "examples/porygon-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Trav55555/ultty"
rust-version = "1.75"

[workspace.dependencies]
# Protocol & Serialization
bytes = "1.5"
zerocopy = { version = "0.7", features = ["derive"] }

# Layout
taffy = "0.5"

# Terminal Backend (for fallback mode)
crossterm = "0.28"
ratatui = "0.29"

# Async
tokio = { version = "1.42", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }

# GPU Rendering
wgpu = "0.19"
winit = "0.29"
bytemuck = { version = "1.14", features = ["derive"] }

# Text Rendering
cosmic-text = "0.11"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = "0.12"

# Testing
insta = { version = "1.34", features = ["json"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
pretty_assertions = "1.4"
test-case = "3.3"
rstest = "0.18"

# Internal crates
ultty-protocol = { path = "crates/ultty-protocol" }
ultty-client = { path = "crates/ultty-client" }
ulttui = { path = "crates/ulttui" }
ultty = { path = "crates/ultty" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1  # Faster dev builds with some optimization

[profile.dev.package."*"]
opt-level = 3  # Dependencies always optimized
