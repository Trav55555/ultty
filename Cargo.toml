[workspace]
resolver = "2"
members = [
    "crates/ultty",
    "crates/ulttui",
    "crates/ultty-protocol",
    "crates/ultty-client",
    "crates/ultty-vt",
    "examples/hello-native",
    "examples/counter-app",
    "examples/todo-app",
    "examples/dashboard",
    "examples/chat",
    "examples/form-app",
    "examples/split-panes",
    "examples/async-fetch",
    "examples/sysmon",
]
# porygon-tui is a standalone client for a private daemon; it builds from its own
# directory and is intentionally kept out of the workspace build and test set.
exclude = ["examples/porygon-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Trav55555/ultty"
rust-version = "1.89"

[workspace.dependencies]
base64 = "0.21"
# Protocol & Serialization
bytes = "1.5"

# Layout
taffy = "0.15"

# Terminal Backend (for fallback mode)
crossterm = "0.29"
ratatui = "0.30"

# Async
tokio = { version = "1.42", features = ["full"] }
futures-core = "0.3"
tokio-tungstenite = "0.24"
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GPU Rendering
wgpu = "30"
winit = "0.30"
bytemuck = { version = "1.14", features = ["derive"] }

# Text Rendering
cosmic-text = "0.19"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = "0.12"
unicode-width = "0.2"

# Testing
insta = { version = "1.34", features = ["json"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
pretty_assertions = "1.4"
test-case = "3.3"
rstest = "0.18"

# Internal crates
ultty-protocol = { path = "crates/ultty-protocol" }
ultty-client = { path = "crates/ultty-client" }
ultty-vt = { path = "crates/ultty-vt" }
ulttui = { path = "crates/ulttui" }
ultty = { path = "crates/ultty" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1  # Faster dev builds with some optimization

[profile.dev.package."*"]
opt-level = 3  # Dependencies always optimized
