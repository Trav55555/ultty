# CI on Gitea Actions (git.traversannan.com), the primary remote; GitHub is
# a push mirror. Jobs run on the ultty pool: x86_64 Fargate Spot tasks, one
# job each, defined with their image in the gitea-server repository. The image
# carries the toolchains (stable, MSRV, RUST_NIGHTLY), cargo-audit, cargo-fuzz,
# the Wayland/X11 headers and Xvfb with lavapipe, so jobs install nothing.
# Tasks start empty and run on the host (no docker); compiles are cached in S3
# through sccache. Run steps go through scripts/ci-runner-step.sh, which also
# keeps the pool's heartbeat: without it the scaler stops the task mid-job.
# There is no macOS runner: macOS builds only run in the GitHub release
# workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR supersedes its running checks; main runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # The stable toolchain comes from rust-toolchain.toml; the runner image's
  # RUST_TOOLCHAIN matches it, so bump the image with the file.
  # Minimum supported Rust version declared in the root Cargo.toml; the
  # runner image's RUST_MSRV matches it.
  RUST_MSRV: 1.90
  # The nightly the fuzz job runs, baked into the runner image (RUST_NIGHTLY).
  RUST_NIGHTLY: nightly-2026-11-01
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_REGION: us-east-1
  SCCACHE_S3_KEY_PREFIX: ultty/

jobs:
  fmt:
    name: Format
    runs-on: ultty
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  security-audit:
    name: Security Audit
    runs-on: ultty
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-runner-step.sh scripts/security-audit.sh

  clippy:
    name: Clippy
    runs-on: ultty
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-runner-step.sh cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ultty
    steps:
      - uses: actions/checkout@v4
      - name: Session deployment packaging
        run: python3 -S -m unittest discover -s scripts/deploy -p 'test_*.py'
      - name: Installer against current and older releases
        run: scripts/install-sh-test.sh
      - run: scripts/ci-runner-step.sh cargo test --workspace
      - name: Protocol roundtrip property tests
        run: scripts/ci-runner-step.sh cargo test -p ultty-protocol --test roundtrip -- --ignored
        env:
          RUST_MIN_STACK: 8388608
      - name: Snapshot tests
        run: scripts/ci-runner-step.sh cargo test -p ulttui --test snapshots
      # Heap bytes from a counting allocator: deterministic, so it gates
      # without flaking. Fails when a case exceeds its budget (+5%).
      - name: Memory budgets
        run: scripts/ci-runner-step.sh cargo test -p ultty --bench memory
      # The compatibility scorecard page must match its scorecard_ tests.
      - name: Compatibility scorecard
        run: scripts/ci-runner-step.sh scripts/compat-scorecard.sh --check

  msrv:
    name: MSRV
    runs-on: ultty
    steps:
      - uses: actions/checkout@v4
      # The runner image ships the MSRV toolchain; install it here only if the
      # image predates an MSRV change (quick no-op otherwise).
      - run: rustup toolchain install "$RUST_MSRV" --profile minimal
      # RUSTUP_TOOLCHAIN overrides the pinned rust-toolchain.toml so this job
      # really builds with the MSRV.
      - run: scripts/ci-runner-step.sh cargo check --workspace --all-targets
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_MSRV }}

  # porygon-tui is outside the workspace (its own lockfile and a large
  # dependency tree), so workspace gates do not cover its daemon contracts.
  porygon-tui:
    name: porygon-tui
    runs-on: ultty
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --manifest-path examples/porygon-tui/Cargo.toml -- --check
      - run: scripts/ci-runner-step.sh cargo clippy --locked --manifest-path examples/porygon-tui/Cargo.toml --all-targets -- -D warnings
      - run: scripts/ci-runner-step.sh cargo test --locked --manifest-path examples/porygon-tui/Cargo.toml

  vt-integrity:
    name: VT integrity (deep property run)
    runs-on: ultty
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-runner-step.sh cargo test -p ultty-vt --test integrity
        env:
          PROPTEST_CASES: "20000"

  fuzz:
    name: Fuzz (smoke)
    runs-on: ultty
    env:
      # cargo-fuzz supplies its own sanitizer and coverage flags.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      # fuzz/ inherits the repository's pinned stable rust-toolchain.toml, so
      # each run names the nightly; cargo-fuzz needs -Z sanitizer flags.
      - name: VT parser and grid
        working-directory: fuzz
        run: ../scripts/ci-runner-step.sh cargo "+$RUST_NIGHTLY" fuzz run vt_terminal -- -max_total_time=120 -max_len=4096
      - name: Protocol decoders
        working-directory: fuzz
        run: |
          ../scripts/ci-runner-step.sh cargo "+$RUST_NIGHTLY" fuzz run decode_app -- -max_total_time=30
          ../scripts/ci-runner-step.sh cargo "+$RUST_NIGHTLY" fuzz run decode_terminal -- -max_total_time=30
      - name: In-band stream splitter
        working-directory: fuzz
        run: ../scripts/ci-runner-step.sh cargo "+$RUST_NIGHTLY" fuzz run in_band_split -- -max_total_time=60 -max_len=4096

  # Instruction counts (callgrind) of the VT core, this commit against its
  # merge-base, built and measured in this job so toolchain and libc cancel
  # out. Fails when a corpus regresses by more than 3%; the per-case table is
  # in the log. See docs/perf/README.md, "Deterministic gate".
  vt-icount:
    name: VT icount
    runs-on: ultty
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # valgrind is not in the runner image yet; the script apt-installs it.
      - run: scripts/ci-runner-step.sh scripts/ci-icount.sh "$ICOUNT_BASE"
        env:
          ICOUNT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  gui-smoke:
    name: GUI smoke (Xvfb, software Vulkan)
    runs-on: ultty
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # lavapipe (mesa-vulkan-drivers) renders without a GPU; Xvfb is the
      # display. Ultty runs for real and the live smokes drive it. The runner
      # image carries the X11 client libraries winit loads at runtime.
      - run: scripts/ci-runner-step.sh cargo build -p ultty -p hello-native -p counter-app --bins
      - run: scripts/ci-runner-step.sh cargo build --locked -p ultty-client --example inline-surface
      - run: scripts/ci-runner-step.sh cargo build --locked -p agent-transcript
      # Jobs install nothing on this runner, so the tmux half of
      # agent-transcript.sh runs only if the image (gitea-server repository)
      # has tmux; otherwise it is skipped, loudly, and GitHub runs it.
      - run: scripts/ci-runner-step.sh scripts/ci-gui-smoke.sh "$RUNNER_TEMP/gui-smoke"
      # Upstream upload-artifact v4.2.0 with its GitHub-only host check
      # removed: Gitea's artifact API lists and serves only v4 uploads.
      - name: Upload smoke artifacts
        if: failure()
        uses: christopherhx/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: gui-smoke
          path: ${{ runner.temp }}/gui-smoke
