# Nextest configuration for local development and CI.
# Prevents a hung test from holding a CI runner until the job timeout while
# reporting every failure in a run.

[profile.default]
slow-timeout = { period = "30s" }

[profile.ci]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 6 }
status-level = "slow"
final-status-level = "flaky"
