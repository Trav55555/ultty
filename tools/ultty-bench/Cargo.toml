[package]
name = "ultty-bench"
description = "Benchmark harness for Ultty: deterministic corpora, headless VT throughput, and terminal-neutral PTY drivers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Measurement tooling only; never packaged or shipped with the terminal.
publish = false

[dependencies]
ultty-vt = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
nix = { version = "0.29", features = ["term", "poll", "fs"] }
x11rb = { version = "0.13", features = ["xtest"] }

[features]
# The ADR 0022 page-storage prototype: `ultty-bench vt --suite proto`,
# `ultty-bench proto-check`, `ultty-bench proto-flood` and `ultty-proto-mem`.
proto = ["ultty-vt/page-proto"]

[[bin]]
name = "ultty-proto-mem"
required-features = ["proto"]
