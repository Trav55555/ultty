# CI for pull requests and pushes on GitHub. It mirrors .gitea/workflows/ci.yml,
# which runs on the primary remote; keep the two in step.
#
# Third-party actions are pinned to commit SHAs. Every job only reads the
# repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Pinned to match rust-toolchain.toml. Bump all workflows together.
  RUST_TOOLCHAIN: 1.98.1
  # Minimum supported Rust version declared in the root Cargo.toml.
  RUST_MSRV: 1.90

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: python3 scripts/comment-ratchet.py

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-audit@0.22.1
      - run: scripts/security-audit.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo check --locked -p ultty --no-default-features
      - run: cargo check --locked -p ultty --features heap-stats
      - run: cargo check --locked -p ulttui --no-default-features
      - name: Library docs
        run: cargo doc --locked --no-deps -p ultty-vt -p ultty-protocol -p ultty-client -p ulttui
        env:
          RUSTDOCFLAGS: -Dwarnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Session deployment packaging
        run: python3 -S -m unittest discover -s scripts/deploy -p 'test_*.py'
      - name: Theme importer
        run: python3 -S -m unittest discover -s scripts/themes -p 'test_*.py'
      - name: Benchmark helpers
        run: |
          python3 -I scripts/bench/test_k2p_wayland.py
          python3 -I scripts/bench/analyze.py --self-test
      - name: Installer against current and older releases
        run: scripts/install-sh-test.sh
      - name: Runner step wrapper
        run: scripts/ci-runner-step-test.sh
      - run: cargo test --locked --workspace
      - name: Protocol roundtrip property tests
        run: cargo test --locked -p ultty-protocol --test roundtrip -- --ignored
        env:
          RUST_MIN_STACK: 8388608
      - name: Memory budgets
        run: cargo test --locked -p ultty --bench memory
      - name: Compatibility scorecard
        run: scripts/compat-scorecard.sh --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: ${{ env.RUST_MSRV }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo check --locked --workspace --all-targets

  vt-integrity:
    name: VT integrity (deep property run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p ultty-vt --test integrity
        env:
          PROPTEST_CASES: "20000"

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz supplies its own sanitizer and coverage flags.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-fuzz@0.12.0
      - name: Fuzz targets (parallel waves)
        run: scripts/ci-fuzz-smoke.sh --mode smoke nightly
      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  gui-smoke:
    name: GUI smoke (Xvfb, software Vulkan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan1
          libx11-xcb1 libxcursor1 libxrandr2 libxi6
          xvfb xdotool tmux mesa-vulkan-drivers fonts-dejavu-core
      - run: cargo build --locked -p ultty -p hello-native -p counter-app -p agent-transcript -p agent-console -p ulttui-lua --bins
      - run: cargo build --locked -p ultty-client --example inline-surface
      - run: scripts/ci-gui-smoke.sh "$RUNNER_TEMP/gui-smoke"
      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gui-smoke
          path: ${{ runner.temp }}/gui-smoke
