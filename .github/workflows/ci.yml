name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Pinned to match rust-toolchain.toml. Bump both together.
  RUST_TOOLCHAIN: 1.98.1
  # Minimum supported Rust version declared in the root Cargo.toml.
  RUST_MSRV: 1.85

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
        env:
          RUSTFLAGS: ""
      - run: scripts/security-audit.sh

  clippy:
    name: Clippy
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
        if: runner.os == 'Linux'
      - run: cargo test --workspace
      - name: Protocol roundtrip property tests
        run: cargo test -p ultty-protocol --test roundtrip -- --ignored
        env:
          RUST_MIN_STACK: 8388608
      - name: Snapshot tests
        run: cargo test -p ulttui --test snapshots

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # dtolnay/rust-toolchain exports RUSTUP_TOOLCHAIN, which overrides the
      # pinned rust-toolchain.toml so this job really builds with the MSRV.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MSRV }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo check --workspace --all-targets

  vt-integrity:
    name: VT integrity (deep property run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ultty-vt --test integrity
        env:
          PROPTEST_CASES: "20000"

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz supplies its own sanitizer and coverage flags.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.12.0 --locked
      # fuzz/ inherits the repository's pinned stable rust-toolchain.toml, so
      # each run names nightly; cargo-fuzz needs -Z sanitizer flags.
      - name: VT parser and grid
        working-directory: fuzz
        run: cargo +nightly fuzz run vt_terminal -- -max_total_time=120 -max_len=4096
      - name: Protocol decoders
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run decode_app -- -max_total_time=30
          cargo +nightly fuzz run decode_terminal -- -max_total_time=30
      - name: In-band stream splitter
        working-directory: fuzz
        run: cargo +nightly fuzz run in_band_split -- -max_total_time=60 -max_len=4096

  gui-smoke:
    name: GUI smoke (Xvfb, software Vulkan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # lavapipe (mesa-vulkan-drivers) renders without a GPU; Xvfb is the
      # display. Ultty runs for real and the live smokes drive it.
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan1
          xvfb mesa-vulkan-drivers fonts-dejavu-core
      - run: cargo build -p ultty -p hello-native -p counter-app --bins
      - run: scripts/ci-gui-smoke.sh "$RUNNER_TEMP/gui-smoke"
      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke
          path: ${{ runner.temp }}/gui-smoke
