name: Release

# Releases are built and published by .gitea/workflows/release.yml on the
# self-hosted runner pool, which also uploads to the GitHub release. This
# workflow runs only when started by hand (for example to rebuild a release
# with GitHub's runners), so a tag does not publish twice.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.2.0)
        required: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag }}
  # Pinned to match rust-toolchain.toml and ci.yml. Bump all three together.
  RUST_TOOLCHAIN: 1.98.1
  CROSS_VERSION: 0.2.5

# Every job reads only, except `release`, which publishes.
permissions:
  contents: read

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    # Targets marked optional may fail without stopping the release, so a
    # Linux x86_64-only release can go out while the others are unavailable.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            optional: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            optional: true
          - target: x86_64-apple-darwin
            os: macos-latest
            optional: true
          - target: aarch64-apple-darwin
            os: macos-latest
            optional: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --locked --release -p ultty --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --locked --release -p ultty --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          mkdir -p package/dist
          cp ultty ulttyctl ultty-session package/
          cp ../../../dist/ultty.desktop package/dist/
          cp -R ../../../dist/icons package/dist/
          cp -R ../../../dist/terminfo package/dist/
          cp -R ../../../dist/shell-integration package/dist/
          tar czf ../../../ultty-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz -C package .

      - name: Smoke tarball contents
        run: |
          scripts/release-artifact-smoke.sh \
            --tarball ultty-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz \
            --homebrew dist/homebrew/ultty.rb

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ultty-${{ matrix.target }}
          path: ultty-${{ env.RELEASE_TAG }}-${{ matrix.target }}.*

  deb:
    name: Build .deb
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev ncurses-bin
      - name: Download x86_64 Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ultty-x86_64-unknown-linux-gnu
          path: artifacts
      - run: |
          mkdir -p target/x86_64-unknown-linux-gnu/release
          tar xzf artifacts/ultty-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release
      - name: Compile the terminfo entry
        run: mkdir -p target/terminfo && tic -x -o target/terminfo dist/terminfo/ultty.terminfo
      - name: Smoke Linux tarball binaries
        run: |
          scripts/release-artifact-smoke.sh \
            --tarball artifacts/ultty-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz \
            --run-binaries
      - run: cargo install cargo-deb --version 3.7.0 --locked
      - run: cargo deb -p ultty --no-build --target x86_64-unknown-linux-gnu
      - name: Smoke .deb artifact
        run: scripts/release-artifact-smoke.sh --deb target/debian/*.deb
      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ultty-deb
          path: target/debian/*.deb

  rpm:
    name: Build .rpm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev rpm ncurses-bin
      - name: Download x86_64 Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ultty-x86_64-unknown-linux-gnu
          path: artifacts
      - run: |
          mkdir -p target/x86_64-unknown-linux-gnu/release
          tar xzf artifacts/ultty-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release
      - name: Compile the terminfo entry
        run: mkdir -p target/terminfo && tic -x -o target/terminfo dist/terminfo/ultty.terminfo
      - name: Smoke Linux tarball binaries
        run: |
          scripts/release-artifact-smoke.sh \
            --tarball artifacts/ultty-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz \
            --run-binaries
      - run: cargo install cargo-generate-rpm --version 0.21.0 --locked
      - run: cargo generate-rpm -p crates/ultty --target x86_64-unknown-linux-gnu
      - name: Smoke .rpm artifact
        run: scripts/release-artifact-smoke.sh --rpm target/x86_64-unknown-linux-gnu/generate-rpm/*.rpm
      - name: Upload .rpm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ultty-rpm
          path: target/x86_64-unknown-linux-gnu/generate-rpm/*.rpm

  release:
    name: Create Release
    # Depends on deb and rpm so SHA256SUMS covers every published artifact.
    needs: [build, deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign the build provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: artifacts
        run: |
          rm -f SHA256SUMS
          # Write outside the directory first: the shell creates the output
          # file before find runs, so it would list itself with an empty hash.
          find . -maxdepth 1 -type f -printf '%P\n' \
            | sort \
            | xargs sha256sum >"$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      # Signed build provenance for every artifact, verifiable with
      # `gh attestation verify <file> --repo Trav55555/ultty`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/SHA256SUMS

      # The formula covers macOS and Linux, so it is published only when the
      # macOS tarballs were built.
      - name: Render Homebrew formula
        id: homebrew
        shell: bash
        run: |
          tag="${{ env.RELEASE_TAG }}"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            if [ ! -f "artifacts/ultty-$tag-$target.tar.gz" ]; then
              echo "::notice::no $target build; not publishing a Homebrew formula"
              exit 0
            fi
          done
          scripts/render-homebrew-formula.sh \
            --version "$tag" \
            --artifact-dir artifacts \
            --out artifacts/ultty.rb
          scripts/release-artifact-smoke.sh \
            --expected-version "${tag#v}" \
            --homebrew-rendered artifacts/ultty.rb

      # The notes are the tag's section of CHANGELOG.md; a tag without one
      # does not publish.
      - name: Extract release notes
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md >"$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
