name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Install cross
        if: matrix.cross
        run: cargo install cross

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release -p ultty --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release -p ultty --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar czf ../../../ultty-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ultty ulttyctl
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultty-${{ matrix.target }}
          path: ultty-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deb:
    name: Build .deb
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Download x86_64 Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ultty-x86_64-unknown-linux-gnu
          path: artifacts
      - run: |
          mkdir -p target/x86_64-unknown-linux-gnu/release
          tar xzf artifacts/ultty-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release
      - run: cargo install cargo-deb
      - run: cargo deb -p ultty --no-build --target x86_64-unknown-linux-gnu
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ultty-deb
          path: target/x86_64-unknown-linux-gnu/debian/*.deb
      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-unknown-linux-gnu/debian/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
